// DELIBERATELY VULNERABLE. Test fixture for Phoenix Security remediation (remedy-fix).
// Mirrors pom.xml. The kotlin, ktlint and dependency-check plugins exist only so Phoenix's
// Gradle validation specs (compileKotlin, ktlintCheck, dependencyCheckAnalyze, test) can run.
plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.1.0'
    id 'org.jlleitschuh.gradle.ktlint' version '12.1.2'
    id 'org.owasp.dependencycheck' version '8.4.3'
}

group = 'com.phoenix.demo'
version = '0.1.0'

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.logging.log4j:log4j-core:2.14.1'
    implementation 'org.apache.commons:commons-text:1.9'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.9.8'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
